<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Praktisk info – Rasmine & Mathias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/petals.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>
  <div id="petal-container" aria-hidden="true"></div>

  <header class="hero hero-small">
    <div data-include="header"></div>

    <section class="hero-content hero-content-small">
      <p class="hero-kicker">Praktisk info</p>
      <h1 class="page-title">Alt det praktiske</h1>
      <p class="page-sub">Dresscode, parkering, børn, gaver…</p>
    </section>
  </header>

  <main>
    <section class="section">
      <div class="card">
        <h3>Dresscode</h3>
        <p>Kom som du føler dig bedst tilpas (vi opdaterer).</p>
      </div>

      <div class="card">
        <h3>Parkering</h3>
        <p>Info kommer…</p>
      </div>

      <div class="card">
        <h3>Børn</h3>
        <p>Info kommer…</p>
      </div>

      <div class="card">
        <h3>Gaver</h3>
        <p>Info kommer…</p>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="../js/transitions.js"></script>
  <script src="../js/petals.js"></script>
</body>
</html>
