<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Bryllupsweekenden – Rasmine & Mathias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/petals.css" />
  <link rel="stylesheet" href="../css/paws.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>
  <div id="petal-container" aria-hidden="true"></div>

  <header class="hero hero-small">
    <div data-include="header"></div>

    <section class="hero-content hero-content-small">
      <p class="hero-kicker">Bryllupsweekenden</p>
      <h1 class="page-title">Program & tider</h1>
      <p class="page-sub">Vi opdaterer løbende med flere detaljer.</p>
    </section>
  </header>

  <main>
    <section class="section">
      <div class="container">
        
        <h2 class="section-title">
          Overblik
          <span id="secret-umbrella" style="cursor: pointer; font-size: 1.1rem; vertical-align: middle; display: inline-block; margin-left: 10px;" title="Vejrudsigt...">☂️</span>
        </h2>
        <p class="section-intro">Her kan I finde programmet for weekenden (kommer snart).</p>

        <div class="card">
          <h3>Fredag</h3>
          <p>Indtjek / hygge / detaljer kommer…</p>
        </div>

        <div class="card">
          <h3>Lørdag</h3>
          <p>Ceremoni / middag / fest…</p>
        </div>

        <div class="card">
          <h3>Søndag</h3>
          <p>Morgenmad / farvel & tak…</p>
        </div>

      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="../js/transitions.js"></script>
  <script src="../js/petals.js"></script>
  <script src="../js/paws.js"></script>
  <script src="../js/easteregg.js"></script> </body>
