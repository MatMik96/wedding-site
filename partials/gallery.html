<section id="galleri" class="section section-alt">
  <div class="gallery-wrapper">
    
    <div class="gallery-header">
      <h2>Billeder fra weekenden</h2>
      <p>Billeder bliver tilføjet her efter bryllupsweekenden.</p>
      <p class="gallery-status" id="galleryStatus">Indlæser billeder…</p>
    </div>

    <div class="gallery-filter-block">
      <span class="filter-label">Dag</span>

      <div class="gallery-controls">
        <button data-day="fredag">Fredag</button>
        <button data-day="lørdag">Lørdag</button>
        <button data-day="søndag">Søndag</button>
      </div>

      <div class="gallery-controls secondary" id="eventControls"></div>
    </div>

    <div class="photo-gallery"></div>
  </div>
</section>
