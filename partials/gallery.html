<!-- Gallery section with filter controls and photo gallery container -->
<section id="galleri" class="section section-alt">
  <div class="gallery-wrapper">
    
    <div class="gallery-header">
      <h2>Billeder fra weekenden</h2>
      <p class="gallery-description">Billeder bliver tilføjet her efter bryllupsweekenden.</p>
      <p class="gallery-status" id="galleryStatus">Indlæser billeder…</p>
    </div> 

    <div class="gallery-filter-block">
      <span class="filter-label">Dag</span>

      <div class="gallery-controls">
        <button data-day="fotograf">Fotograf</button>
        <button data-day="selfiecam">SelfieCam</button>
        <button data-day="pov-app">POV-App</button>
      </div>

      <div class="gallery-controls secondary" id="eventControls"></div>
    </div>

    <div class="photo-gallery"></div>
  </div>
</section>
